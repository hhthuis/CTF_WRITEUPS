<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brunnerne Inc Yearly Bonus Opportunity</title>
    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        --page: #f5f5f7;
        --card: #fff;
        --tile: #ededf0;
        --text: #1d1d1f;
        --muted: #6e6e73;
        --radius-lg: 28px;
        --radius-md: 22px;
        --radius-sm: 18px;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--page);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
          Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      main {
        width: min(92vw, 620px);
        display: grid;
        gap: 16px;
        justify-items: center;
      }

      .brand {
        display: grid;
        gap: 6px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 6vw, 46px);
        line-height: 1.02;
      }

      .tagline {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        font-weight: 800;
      }

      .hud {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .cash,
      .streak {
        min-height: 40px;
        display: grid;
        place-items: center;
        padding: 8px 16px;
        border-radius: 999px;
        background: var(--card);
        font-weight: 800;
        line-height: 1;
      }

      .cash {
        font-size: 24px;
      }

      .streak {
        color: var(--muted);
        font-size: 15px;
      }

      .machine {
        width: 100%;
        padding: 24px;
        border-radius: var(--radius-lg);
        background: var(--card);
      }

      .reels {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
      }

      .reel {
        aspect-ratio: 1;
        position: relative;
        overflow: hidden;
        border-radius: var(--radius-sm);
        background: var(--tile);
        font-size: clamp(58px, 12vw, 96px);
        user-select: none;
      }

      .strip {
        position: absolute;
        inset: 0 0 auto;
        height: 100%;
        will-change: transform;
      }

      .symbol {
        height: var(--cell, 100%);
        display: grid;
        place-items: center;
        line-height: 1;
        transform: translateY(0) scale(1);
      }

      .reel.land .symbol {
        animation: land 0.42s cubic-bezier(0.2, 1.5, 0.35, 1);
      }

      .machine.win {
        animation: jackpot 0.72s cubic-bezier(0.2, 1.55, 0.35, 1);
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        min-height: 58px;
        padding: 10px 26px;
        background: var(--text);
        color: #fff;
        font: inherit;
        font-size: 19px;
        font-weight: 800;
        cursor: pointer;
        display: grid;
        gap: 1px;
        min-width: 126px;
        place-items: center;
        line-height: 1.05;
        transition:
          transform 0.16s ease,
          opacity 0.16s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(1px) scale(0.98);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.55;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }

      .redeem {
        min-width: 154px;
        background: var(--card);
        color: var(--text);
      }

      button small {
        color: inherit;
        font-size: 12px;
        font-weight: 800;
        opacity: 0.62;
      }

      .proof {
        position: absolute;
        top: 0;
        left: 50%;
        width: max-content;
        max-width: min(92vw, 620px);
        max-height: 48px;
        z-index: 5;
        border-radius: 999px;
        background: var(--card);
        font-size: 13px;
        font-weight: 800;
        overflow: hidden;
        transform: translateX(-50%);
        transition:
          width 0.28s ease,
          max-height 0.28s ease;
      }

      .proof.open {
        width: min(92vw, 620px);
        max-height: 126px;
        border-radius: var(--radius-md);
      }

      .proof-toggle {
        width: auto;
        cursor: pointer;
        border-radius: 0;
        padding: 12px 18px;
        background: transparent;
        color: var(--text);
        text-align: center;
        font-size: 13px;
        min-width: 0;
        min-height: 42px;
        transform: none;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 8px;
      }

      .proof.open .proof-toggle {
        width: 100%;
      }

      .proof-toggle:hover,
      .proof-toggle:active,
      .proof-toggle:focus {
        outline: 0;
        transform: none;
      }

      .chevron {
        width: 8px;
        height: 8px;
        border-right: 2px solid currentColor;
        border-bottom: 2px solid currentColor;
        opacity: 0.7;
        transform: rotate(45deg) translateY(-2px);
        transition: transform 0.2s ease;
      }

      .proof.open .chevron {
        transform: rotate(225deg) translateY(-2px);
      }

      .proof-body {
        position: absolute;
        width: 0;
        height: 0;
        display: grid;
        gap: 6px;
        padding: 0;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
        transform: translateY(-8px);
        transition:
          opacity 0.24s ease,
          transform 0.24s ease;
      }

      .proof.open .proof-body {
        position: static;
        width: 100%;
        height: 78px;
        padding: 0 18px 14px;
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      .proof-space {
        position: relative;
        width: 100%;
        height: 46px;
      }

      .proof-row {
        min-height: 24px;
        display: grid;
        place-items: center;
        overflow-wrap: anywhere;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.25;
      }

      .proof-row.bottom-in {
        animation: bottom-in 0.34s ease forwards;
      }

      .proof-float {
        position: fixed;
        z-index: 20;
        display: grid;
        place-items: center;
        color: var(--text);
        font-size: 12px;
        font-weight: 800;
        text-align: center;
        pointer-events: none;
      }

      .paytable {
        position: fixed;
        top: 50%;
        left: calc(50% + 330px);
        width: 260px;
        display: grid;
        gap: 12px;
        padding: 26px;
        border-radius: var(--radius-md);
        background: var(--card);
        transform: translateY(-50%);
        text-align: left;
        font-size: 15px;
        font-weight: 800;
      }

      .paytable span {
        display: grid;
        grid-template-columns: 96px max-content;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        white-space: nowrap;
      }

      .paytable b {
        font-size: 17px;
        line-height: 1;
      }

      .paytable small {
        font: inherit;
        color: var(--text);
        font-size: 17px;
        text-align: right;
      }

      .paytable .note {
        grid-column: 1 / -1;
        display: block;
        margin-top: 8px;
        padding: 10px 12px;
        border-radius: 999px;
        background: var(--tile);
        color: var(--muted);
        font-size: 12px;
        text-align: center;
        white-space: normal;
      }

      .message {
        min-height: 22px;
        max-width: 100%;
        text-align: center;
        overflow-wrap: anywhere;
        font-size: 14px;
        font-weight: 800;
      }

      @media (max-width: 980px) {
        body {
          align-items: start;
          padding: 42px 0 126px;
        }

        .machine {
          padding: 20px;
        }

        .reels {
          gap: 16px;
        }

        .paytable {
          left: 50%;
          right: auto;
          top: auto;
          bottom: 14px;
          width: min(92vw, 620px);
          grid-template-columns: repeat(7, max-content);
          justify-content: center;
          gap: 10px 14px;
          padding: 16px;
          transform: translateX(-50%);
          font-size: 12px;
        }

        .paytable span {
          display: flex;
          gap: 6px;
        }

        .paytable b {
          font-size: 14px;
        }

        .paytable small {
          font-size: 12px;
        }

        .paytable .note {
          padding: 0;
          background: transparent;
        }
      }

      .win-pop {
        position: fixed;
        left: 50%;
        top: 24%;
        color: #181818;
        font-size: clamp(36px, 9vw, 72px);
        font-weight: 1000;
        pointer-events: none;
        animation: win-pop 1.1s cubic-bezier(0.2, 1.5, 0.35, 1) forwards;
      }

      .confetti {
        position: fixed;
        left: 50%;
        top: 48%;
        width: 12px;
        height: 18px;
        border-radius: 4px;
        pointer-events: none;
        animation: confetti 980ms cubic-bezier(0.12, 0.8, 0.24, 1) forwards;
      }

      @keyframes land {
        0% {
          transform: translateY(-14%) scale(0.9);
        }
        55% {
          transform: translateY(6%) scale(1.14);
        }
        100% {
          transform: translateY(0) scale(1);
        }
      }

      @keyframes jackpot {
        0%,
        100% {
          transform: scale(1) rotate(0);
        }
        35% {
          transform: scale(1.05) rotate(-1deg);
        }
        70% {
          transform: scale(1.04) rotate(1deg);
        }
      }

      @keyframes confetti {
        from {
          opacity: 1;
          transform: translate(-50%, -50%) rotate(0) scale(0.8);
        }
        to {
          opacity: 0;
          transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y)))
            rotate(var(--r)) scale(1);
        }
      }

      @keyframes win-pop {
        0% {
          opacity: 0;
          transform: translate(-50%, 20px) scale(0.75);
        }
        20% {
          opacity: 1;
          transform: translate(-50%, 0) scale(1.12);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -82px) scale(1);
        }
      }

      @keyframes bottom-in {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="brand">
        <h1>Brunnerne Inc Yearly Bonus Opportunity</h1>
        <p class="tagline">A performance-based employee enrichment initiative.</p>
      </header>
      <div class="hud">
        <div class="cash">$1,000</div>
        <div class="streak">Win streak: 0</div>
      </div>
      <section class="machine" aria-label="Bonus opportunity machine">
        <div class="reels">
          <div class="reel"><div class="strip"><span class="symbol">🍒</span></div></div>
          <div class="reel"><div class="strip"><span class="symbol">💎</span></div></div>
          <div class="reel"><div class="strip"><span class="symbol">🔔</span></div></div>
        </div>
      </section>
      <div class="actions">
        <button class="spin" type="button" disabled>
          <span>Spin</span>
          <small>$25</small>
        </button>
        <button class="redeem" type="button" disabled>
          <span>Redeem bonus</span>
          <small>$1,000,000</small>
        </button>
      </div>
      <div class="proof-space">
        <section class="proof">
          <button class="proof-toggle" type="button" aria-expanded="false">
            <span>Fairness proof</span>
            <span class="chevron" aria-hidden="true"></span>
          </button>
          <div class="proof-body">
            <div class="last-proof proof-row"></div>
            <div class="next-proof proof-row">Connecting...</div>
          </div>
        </section>
      </div>
      <div class="message"></div>
    </main>
    <aside class="paytable" aria-label="Bonus odds"></aside>

    <script>
      let symbols = ["🍒", "🍋", "🍇", "🍉", "⭐", "💎", "🔔"];
      const reels = [...document.querySelectorAll(".reel")];
      const spinButton = document.querySelector(".spin");
      const redeemButton = document.querySelector(".redeem");
      const machine = document.querySelector(".machine");
      const cash = document.querySelector(".cash");
      const streak = document.querySelector(".streak");
      const paytable = document.querySelector(".paytable");
      const proofCard = document.querySelector(".proof");
      const proofToggle = document.querySelector(".proof-toggle");
      const lastProof = document.querySelector(".last-proof");
      const nextProof = document.querySelector(".next-proof");
      const message = document.querySelector(".message");
      const spinCost = document.querySelector(".spin small");
      const flagCost = document.querySelector(".redeem small");
      let sid = "";
      let currentHash = "";

      const money = (amount) => `$${amount.toLocaleString()}`;
      const sleep = (ms) => new Promise((done) => setTimeout(done, ms));
      const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);

      function setCash(amount) {
        cash.textContent = money(amount);
      }

      function setStreak(count) {
        streak.textContent = `Win streak: ${count}`;
      }

      function setBusy(busy) {
        spinButton.disabled = busy;
        redeemButton.disabled = busy;
      }

      async function sha1(value) {
        const bytes = new TextEncoder().encode(value);
        const hash = await crypto.subtle.digest("SHA-1", bytes);
        return [...new Uint8Array(hash)]
          .map((byte) => byte.toString(16).padStart(2, "0"))
          .join("");
      }

      function setNextSpin(next) {
        sid = next.sid;
        currentHash = next.hash;
        nextProof.textContent = `SHA1(❓❓❓) = ${next.hash}`;
      }

      function replayAnimation(element, className) {
        element.classList.remove(className);
        void element.offsetWidth;
        element.classList.add(className);
        return new Promise((done) => element.addEventListener("animationend", () => {
          element.classList.remove(className);
          done();
        }, { once: true }));
      }

      async function animateProof(resultText, oldHash, next) {
        if (!proofCard.classList.contains("open")) {
          lastProof.textContent = `SHA1(${resultText}) = ${oldHash}`;
          setNextSpin(next);
          return;
        }

        const from = nextProof.getBoundingClientRect();
        const to = lastProof.getBoundingClientRect();
        const floater = document.createElement("div");
        const oldText = lastProof.textContent;

        floater.className = "proof-float";
        floater.textContent = `SHA1(❓❓❓) = ${oldHash}`;
        Object.assign(floater.style, {
          left: `${from.left}px`,
          top: `${from.top}px`,
          width: `${from.width}px`,
          height: `${from.height}px`,
        });

        document.body.append(floater);
        nextProof.style.opacity = "0";

        const oldAnimation = oldText ? lastProof.animate(
          [
            { opacity: 1, transform: "translateY(0)" },
            { opacity: 0, transform: "translateY(-18px)" },
          ],
          {
            duration: 320,
            easing: "ease",
            fill: "forwards",
          },
        ) : undefined;

        const moveAnimation = floater.animate(
          [
            { transform: "translateY(0)", opacity: 1 },
            { transform: `translateY(${to.top - from.top}px)`, opacity: 1 },
          ],
          {
            duration: 520,
            easing: "cubic-bezier(.18,.9,.2,1)",
            fill: "forwards",
          },
        );

        await Promise.all([moveAnimation.finished, oldAnimation?.finished]);

        floater.textContent = `SHA1(${resultText}) = ${oldHash}`;
        await sleep(140);
        floater.remove();

        lastProof.textContent = `SHA1(${resultText}) = ${oldHash}`;
        lastProof.getAnimations().forEach((animation) => animation.cancel());
        setNextSpin(next);
        nextProof.style.opacity = "";
        replayAnimation(nextProof, "bottom-in");
      }

      function makeStrip(reel, result, loops) {
        const strip = document.createElement("div");
        strip.className = "strip";

        const sequence = [result];
        sequence.push(...Array.from({ length: loops * symbols.length }, (_, i) => {
          return symbols[i % symbols.length];
        }));

        strip.innerHTML = sequence
          .map((symbol) => `<span class="symbol">${symbol}</span>`)
          .join("");

        reel.style.setProperty("--cell", `${reel.clientHeight}px`);
        reel.replaceChildren(strip);
        return { strip, distance: reel.clientHeight * (sequence.length - 1) };
      }

      async function spinReel(reel, result, index, suspense) {
        reel.classList.remove("land");
        reel.classList.add("spinning");

        const { strip, distance } = makeStrip(reel, result, 5 + index * 2);
        const duration = 1450 + index * 520 + (suspense && index === 2 ? 900 : 0);
        const animation = strip.animate(
          [
            { transform: `translateY(-${distance}px)` },
            { transform: "translateY(0)" },
          ],
          {
            duration,
            easing: "cubic-bezier(.08,.72,.12,1)",
            fill: "forwards",
          },
        );

        await animation.finished;
        reel.classList.remove("spinning");
        reel.classList.add("land");
        reel.innerHTML = `<div class="strip"><span class="symbol">${result}</span></div>`;
      }

      function popWin(win) {
        const pop = document.createElement("div");
        pop.className = "win-pop";
        pop.textContent = `+${money(win)}`;
        document.body.append(pop);
        pop.addEventListener("animationend", () => pop.remove());
      }

      function celebrate(win) {
        machine.classList.remove("win");
        void machine.offsetWidth;
        machine.classList.add("win");
        popWin(win);

        const colors = ["#ff4d4d", "#ffd93d", "#45d483", "#39a7ff", "#b967ff"];
        for (let i = 0; i < 80; i++) {
          const piece = document.createElement("i");
          piece.className = "confetti";
          piece.style.background = colors[i % colors.length];
          piece.style.setProperty("--x", `${Math.random() * 700 - 350}px`);
          piece.style.setProperty("--y", `${Math.random() * 420 - 330}px`);
          piece.style.setProperty("--r", `${Math.random() * 720 - 360}deg`);
          piece.style.animationDelay = `${Math.random() * 120}ms`;
          document.body.append(piece);
          piece.addEventListener("animationend", () => piece.remove());
        }
      }

      async function showSpin(data) {
        if (data.status !== "revealed") {
          setNextSpin(data.next);
          message.textContent = data.message;
          setBusy(false);
          return;
        }

        machine.classList.remove("win");

        const results = data.result.symbols;
        const suspense = results[0] === results[1];

        await Promise.all(
          reels.map((reel, index) => spinReel(reel, results[index], index, suspense)),
        );
        setCash(data.cash);
        setStreak(data.streak);
        const resultText = results.join("");
        const verified = (await sha1(resultText)) === data.result.hash;
        await animateProof(resultText, data.result.hash, data.next);
        message.textContent = verified ? "" : "Bad proof.";
        if (data.result.win > 0) celebrate(data.result.win);
        await sleep(420);
        reels.forEach((reel) => reel.classList.remove("land"));
        setBusy(false);
      }

      ws.addEventListener("message", async (event) => {
        const data = JSON.parse(event.data);

        if (data.type === "state") {
          symbols = data.symbols.map((symbol) => symbol.emoji);
          paytable.textContent = "";
          data.symbols.forEach((symbol) => {
            const item = document.createElement("span");
            item.innerHTML = `<b>${symbol.emoji}${symbol.emoji}${symbol.emoji}</b><small>${money(symbol.payout)}</small>`;
            paytable.append(item);
          });
          const note = document.createElement("span");
          note.className = "note";
          note.textContent = `Streak multiplier: x${data.streakMultiplier} each win`;
          paytable.append(note);
          setCash(data.cash);
          setStreak(data.streak);
          spinCost.textContent = money(data.spinCost);
          flagCost.textContent = money(data.flagCost);
          lastProof.textContent = "";
          message.textContent = "";
          setNextSpin(data.next);
          setBusy(false);
        }

        if (data.type === "spin") await showSpin(data);

        if (data.type === "flag") {
          setCash(data.cash);
          message.textContent = data.flag;
          setBusy(false);
        }

        if (data.type === "error") {
          message.textContent = data.message;
          setBusy(false);
        }
      });

      spinButton.addEventListener("click", () => {
        setBusy(true);
        message.textContent = "";
        ws.send(JSON.stringify({ type: "spin", sid }));
      });

      redeemButton.addEventListener("click", () => {
        setBusy(true);
        ws.send(JSON.stringify({ type: "redeem" }));
      });

      proofToggle.addEventListener("click", () => {
        const open = proofCard.classList.toggle("open");
        proofToggle.setAttribute("aria-expanded", String(open));
      });
    </script>
  </body>
</html>
